name: cv-engine
region: nyc
services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: sqlite:///./data/db.sqlite3

  - name: frontend
    environment_slug: node-js
    source_dir: frontend
    http_port: 3000
    build_command: npm install && npm run build
    run_command: npm run start
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: https://backend.cv-engine.internal
